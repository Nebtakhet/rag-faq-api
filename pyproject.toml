[project]
name = "rag-faq-api"
version = "0.1.0"
description = "Minimal RAG based FAQ API, built with FastAPI, OpenAI embeddings and FAISS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["api", "rag", "openai", "faiss"]
dependencies = [
	"fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.9",
	"openai",
	"faiss-cpu",
    "pypdf>=5.4.0",
	"python-dotenv",
]

[project.urls]
"Homepage" = "https://github.com/Nebtakhet/rag-faq-api"
"Repository" = "https://github.com/Nebtakhet/rag-faq-api.git"
"Issues" = "https://github.com/Nebtakhet/rag-faq-api/issues"
"Documentation" = "https://github.com/Nebtakhet/rag-faq-api#readme"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
	"pip-audit>=2.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "alembic"]